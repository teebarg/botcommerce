services:
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "5100:3000"
    environment:
      - NODE_ENV=development
      - NITRO_DEV_WORKER=false
    volumes:
      - ./app:/app
      - /app/node_modules
      - app-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dev-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-net
      - traefik.http.services.shop.loadbalancer.server.port=3000
      - traefik.http.routers.shop.rule=Host(`shop.localhost`)
      - traefik.http.routers.shop.entrypoints=https
      - traefik.http.routers.shop.tls=true
      - traefik.http.routers.shop-http.rule=Host(`shop.localhost`)
      - traefik.http.routers.shop-http.entrypoints=http
      - traefik.http.routers.shop-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

  backend:
    image: shop:${TAG-latest}
    ports:
      - "5101:8000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-net
      - traefik.http.services.shop-api.loadbalancer.server.port=8000
      - traefik.http.routers.shop-api.rule=Host(`api.shop.localhost`)
      - traefik.http.routers.shop-api.entrypoints=https
      - traefik.http.routers.shop-api.tls=true
      - traefik.http.routers.shop-api-http.rule=Host(`api.shop.localhost`)
      - traefik.http.routers.shop-api-http.entrypoints=http
      - traefik.http.routers.shop-api-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    networks:
      - dev-net
    environment:
      - UV_LINK_MODE=copy # Mutes filesystem crossing warnings cleanly
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
    platform: linux/amd64 # Patch for M1 Mac
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend:/app
      - /app/.venv
      - uv-cache:/root/.cache/uv

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    networks:
      - dev-net
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - UV_LINK_MODE=copy
    volumes:
      - ./worker:/app
      - uvworker-cache:/root/.cache/uv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    
  agent:
    image: shop-agent:${TAG-latest}
    build:
      context: ./agent
      dockerfile: Dockerfile.dev
    ports:
      - "5102:8000"
    networks:
      - dev-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-net
      - traefik.http.services.agent-api.loadbalancer.server.port=8000
      - traefik.http.routers.agent-api.rule=Host(`agent.localhost`)
      - traefik.http.routers.agent-api.entrypoints=https
      - traefik.http.routers.agent-api.tls=true
      - traefik.http.routers.agent-api-http.rule=Host(`agent.localhost`)
      - traefik.http.routers.agent-api-http.entrypoints=http
      - traefik.http.routers.agent-api-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    environment:
      - FASTEMBED_CACHE_PATH=/app/models
      - UV_LINK_MODE=copy
    platform: linux/amd64
    volumes:
      - ./agent:/app
      - /app/.venv
      - uva-cache:/root/.cache/uv
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "5103:8787"
    networks:
      - dev-net
    labels:
      - traefik.enable=true
      - traefik.docker.network=dev-net
      - traefik.http.services.mcp.loadbalancer.server.port=9000
      - traefik.http.routers.mcp.rule=Host(`mcp.localhost`)
      - traefik.http.routers.mcp.entrypoints=https
      - traefik.http.routers.mcp.tls=true
      - traefik.http.routers.mcp-http.rule=Host(`mcp.localhost`)
      - traefik.http.routers.mcp-http.entrypoints=http
      - traefik.http.routers.mcp-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
    env_file:
      - ./mcp-server/.env
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./mcp-server:/app
      - /app/.venv
      - uvmcp-cache:/root/.cache/uv

networks:
  dev-net:
    external: true

volumes:
  app-node-modules:
  uv-cache:
  uva-cache:
  uvmcp-cache:
  uvworker-cache: